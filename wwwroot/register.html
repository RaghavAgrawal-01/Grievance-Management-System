<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grievance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center bg-light min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4 p-4 mt-3 mb-3">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus text-primary fa-3x mb-3"></i>
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Join to submit and track your grievances</p>
                    </div>
                    
                    <div id="registerAlert" class="alert d-none" role="alert"></div>
                    
                    <form id="registerForm" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label fw-semibold">Account Role</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-user-tag text-muted"></i></span>
                                <select id="role" class="form-select" required>
                                    <option value="User" selected>Regular User</option>
                                    <option value="Admin">Administrator</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-sm-6 mb-3 mb-sm-0">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                                <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                                <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm">Create Account</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <hr class="my-3">
                        <p class="mb-0">Already have an account? <a href="index.html" class="text-decoration-none fw-semibold">Sign in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
