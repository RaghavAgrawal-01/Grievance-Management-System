<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Grievance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center bg-light min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow border-0 rounded-4 p-4 mt-3">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-shield text-primary fa-3x mb-3"></i>
                        <h2 class="fw-bold">Reset Password</h2>
                        <p class="text-muted">Enter your token and new password</p>
                    </div>
                    
                    <div id="resetAlert" class="alert d-none" role="alert"></div>
                    
                    <form id="resetForm" class="needs-validation" novalidate>
                        <div class="mb-3 position-relative">
                            <label for="token" class="form-label fw-semibold">Reset Token</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-ticket-alt text-muted"></i></span>
                                <input type="text" id="token" class="form-control border-start-0" placeholder="Paste your token here" required>
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>

                        <div class="mb-3 position-relative">
                            <label for="newPassword" class="form-label fw-semibold">New Password</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="newPassword" class="form-control border-start-0" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>

                        <div class="mb-4 position-relative">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                                <input type="password" id="confirmPassword" class="form-control border-start-0" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm">Reset Password</button>
                    </form>
                    
                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="login.html" class="text-decoration-none small fw-semibold">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
