<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="fas fa-shield-alt me-2"></i> GrievanceTrack
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="submit.html">Submit Grievance</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Track Status</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center mt-3 mt-lg-0">
                    <div class="bg-white text-primary fw-bold rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                        JD
                    </div>
                    <a href="index.html" class="btn btn-sm btn-outline-light ms-3 border-0"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0"><i class="fas fa-file-signature text-primary me-2"></i> Submit a New Grievance</h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="submitAlert" class="alert d-none mb-4" role="alert"></div>
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <form id="complaintForm" class="needs-validation" novalidate>
                            
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="name" class="form-label fw-semibold">Full Name</label>
                                    <input type="text" id="name" class="form-control bg-light" placeholder="Your Full Name" required>
                                    <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email Address</label>
                                    <input type="email" id="email" class="form-control bg-light" placeholder="name@example.com" required>
                                    <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="subject" class="form-label fw-semibold">Subject</label>
                                <input type="text" id="subject" class="form-control bg-light" placeholder="Brief description of the issue" required>
                                <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">Detailed Description</label>
                                <textarea id="description" class="form-control bg-light" rows="5" placeholder="Provide all relevant details here..." required></textarea>
                                <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Attachments (Optional)</label>
                                <div class="border border-2 border-dashed rounded-3 p-5 text-center bg-light upload-area-bs">
                                    <i class="fas fa-cloud-upload-alt fa-3x text-secondary mb-3"></i>
                                    <h5>Click to upload or drag and drop</h5>
                                    <p class="text-muted small mb-0">SVG, PNG, JPG or PDF (max. 5MB)</p>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                                <a href="search.html" class="btn btn-light border px-4 py-2 fw-semibold text-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
                                    <i class="fas fa-paper-plane me-1"></i> Submit Grievance
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
