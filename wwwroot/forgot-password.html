<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Grievance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center bg-light min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow border-0 rounded-4 p-4 mt-3">
                    <div class="text-center mb-4">
                        <i class="fas fa-key text-primary fa-3x mb-3"></i>
                        <h2 class="fw-bold">Forgot Password?</h2>
                        <p class="text-muted">Enter your email to get a reset token</p>
                    </div>
                    
                    <div id="forgotAlert" class="alert d-none" role="alert"></div>
                    
                    <form id="forgotForm" class="needs-validation" novalidate>
                        <div class="mb-4 position-relative">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control border-start-0" placeholder="name@example.com" required>
                            </div>
                            <div class="invalid-feedback error-message text-danger" style="display:none;"></div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm mb-3">Get Reset Token</button>
                        
                        <div id="tokenContainer" class="d-none mt-3 p-3 bg-light border rounded-3 animate__animated animate__fadeIn">
                            <p class="small text-muted mb-2 fw-bold text-uppercase">Your Reset Token:</p>
                            <div class="input-group">
                                <input type="text" id="resetToken" class="form-control form-control-sm font-monospace bg-white" readonly>
                                <button class="btn btn-outline-primary btn-sm" type="button" onclick="copyToken()">Copy</button>
                            </div>
                            <div class="mt-3 text-center">
                                <a href="reset-password.html" class="btn btn-success btn-sm w-100 fw-bold">Proceed to Reset Password</a>
                            </div>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="login.html" class="text-decoration-none small fw-semibold"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        function copyToken() {
            const tokenInput = document.getElementById('resetToken');
            tokenInput.select();
            document.execCommand('copy');
            alert('Token copied to clipboard!');
        }
    </script>
</body>
</html>
