<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="fas fa-shield-alt text-primary me-2"></i> GrievanceTrack
                <span class="badge bg-primary rounded-pill ms-2 ms-sm-3 align-text-bottom"
                    style="font-size: 0.65rem;">ADMIN</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="admin.html">
                            <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="manage-users.html">
                            <i class="fas fa-users me-1"></i> Manage Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">
                            <i class="fas fa-chart-bar me-1"></i> Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">
                            <i class="fas fa-cog me-1"></i> Settings
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center mt-3 mt-lg-0">
                    <div class="bg-light text-dark fw-bold rounded-circle d-flex align-items-center justify-content-center"
                        style="width: 35px; height: 35px;">
                        RA
                    </div>
                    <a href="#" onclick="logout(); return false;"
                        class="btn btn-sm btn-outline-danger ms-3 border-0 fw-semibold"><i
                            class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-5" style="max-width: 1400px;">
        <div id="adminAlert" class="alert d-none mb-4" role="alert"></div>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <h2 class="fw-bold m-0">Dashboard Overview</h2>
            <button class="btn btn-primary fw-bold shadow-sm px-4">
                <i class="fas fa-download me-2"></i> Export Report
            </button>
        </div>

        <!-- Metric Cards -->
        <div class="row g-4 mb-5">

            <!-- Total -->
            <div class="col-sm-6 col-xl-3">
                <div class="card shadow-sm border-0 rounded-4 h-100" style="border-left: 4px solid #0d6efd !important;">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-4 d-flex align-items-center justify-content-center flex-shrink-0"
                            style="width: 60px; height: 60px;">
                            <i class="fas fa-ticket-alt fa-2x"></i>
                        </div>
                        <div class="ms-4">
                            <h2 id="totalCount" class="fw-bold mb-0">—</h2>
                            <p class="text-muted fw-medium mb-0 small text-uppercase">Total Grievances</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pending -->
            <div class="col-sm-6 col-xl-3">
                <div class="card shadow-sm border-0 rounded-4 h-100" style="border-left: 4px solid #ffc107 !important;">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="bg-warning bg-opacity-10 text-warning rounded-4 d-flex align-items-center justify-content-center flex-shrink-0"
                            style="width: 60px; height: 60px;">
                            <i class="fas fa-hourglass-half fa-2x"></i>
                        </div>
                        <div class="ms-4">
                            <h2 id="pendingCount" class="fw-bold mb-0">—</h2>
                            <p class="text-muted fw-medium mb-0 small text-uppercase">Pending</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- In Progress -->
            <div class="col-sm-6 col-xl-3">
                <div class="card shadow-sm border-0 rounded-4 h-100" style="border-left: 4px solid #0d6efd !important;">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-4 d-flex align-items-center justify-content-center flex-shrink-0"
                            style="width: 60px; height: 60px;">
                            <i class="fas fa-spinner fa-2x"></i>
                        </div>
                        <div class="ms-4">
                            <h2 id="inProgressCount" class="fw-bold mb-0">—</h2>
                            <p class="text-muted fw-medium mb-0 small text-uppercase">In Progress</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resolved -->
            <div class="col-sm-6 col-xl-3">
                <div class="card shadow-sm border-0 rounded-4 h-100" style="border-left: 4px solid #198754 !important;">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="bg-success bg-opacity-10 text-success rounded-4 d-flex align-items-center justify-content-center flex-shrink-0"
                            style="width: 60px; height: 60px;">
                            <i class="fas fa-check-circle fa-2x"></i>
                        </div>
                        <div class="ms-4">
                            <h2 id="resolvedCount" class="fw-bold mb-0">—</h2>
                            <p class="text-muted fw-medium mb-0 small text-uppercase">Resolved</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div
                class="card-header bg-white border-bottom p-4 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                <h4 class="fw-bold m-0"><i class="fas fa-list text-primary me-2"></i> All Tickets</h4>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <!-- Live search -->
                    <div class="input-group shadow-sm" style="min-width: 220px;">
                        <span class="input-group-text bg-white border-end-0"><i
                                class="fas fa-search text-muted"></i></span>
                        <input id="adminSearch" type="text" class="form-control border-start-0 ps-1"
                            placeholder="Search ticket, name, email…">
                    </div>
                    <!-- Status filter -->
                    <select id="adminStatusFilter" class="form-select bg-light fw-medium shadow-sm border-0"
                        style="width: auto;">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="in progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <!-- Refresh -->
                    <button id="adminRefreshBtn" class="btn btn-outline-secondary shadow-sm fw-medium"
                        onclick="window.reloadAdminGrievances && window.reloadAdminGrievances()">
                        <i class="fas fa-sync-alt me-1"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light text-muted small text-uppercase">
                        <tr>
                            <th class="ps-4 py-3">Ticket ID</th>
                            <th class="py-3">Name</th>
                            <th class="py-3">Email</th>
                            <th class="py-3">Subject</th>
                            <th class="py-3 text-center">Status</th>
                            <th class="py-3 text-center">Attachment</th>
                            <th class="py-3 pe-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data injected by app.js -->
                    </tbody>
                </table>
            </div>

            <div class="card-footer bg-white border-top p-3 d-flex justify-content-between align-items-center">
                <span id="adminEntryCount" class="text-muted small">Loading…</span>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
